<style>

</style></head><body>
<div class="top"><div class="brand"><b>Fortune Studio</b><span>Payments</span></div>
<div class="seg" id="seg"><button data-d="7">7 days</button><button data-d="30" class="on">30 days</button><button data-d="90">90 days</button><button data-d="365">1 year</button></div>
<button class="btn" id="ref">↻ Refresh</button><a class="btn" href="/visitors">📊 Visitors</a><a class="btn p" href="/admin">← Admin</a></div>
<main><h1>Money and bookings</h1><p class="sub" id="sub">Every payment made on your site, who paid, how much, and what is still to collect.</p>
<div id="sys"></div><div id="out"><div class="grid k4"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div><div class="toast" id="toast"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=id=>document.getElementById(id);
function el(t,p,...k){const e=document.createElement(t);Object.assign(e,p||{});k.forEach(x=>e.append(x));return e}
const usd=n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ET='America/New_York';
const when=t=>new Date(t*1000).toLocaleString('en-US',{timeZone:ET,month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const short=t=>new Date(t*1000).toLocaleDateString('en-US',{timeZone:ET,month:'short',day:'numeric'});
const ago=t=>{const s=Math.max(1,Math.round(Date.now()/1000-t));if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' days ago'};
const toast=t=>{const x=$('toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),2400)};
let sb=null,DAYS=30,DATA=null,Q='',TIMER=0;
function put(...k){const o=$('out');o.textContent='';k.forEach(x=>o.append(x))}
function notice(icon,title,text,...extra){return el('div',{className:'card empty'},el('div',{className:'big',textContent:icon}),el('h2',{textContent:title}),el('p',{textContent:text}),...extra)}
async function token(){const s=(await sb.auth.getSession()).data.session;return s?s.access_token:''}
async function api(path,body){const t=await token();if(!t)throw Error('Please sign in again at /admin.');const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('Error '+r.status));return j}
async function boot(){
  try{
    if(!window.supabase)throw Error('The Supabase library did not load. Refresh the page.');
    const r=await fetch('/api/supabase-config',{cache:'no-store'});const cfg=await r.json();if(!r.ok)throw Error(cfg.error||'Configuration error');
    sb=window.supabase.createClient(cfg.url,cfg.key);
    if(!(await token())){put(notice('🔒','Please sign in first','This page opens after you sign in to the admin on this same browser.',el('a',{className:'btn p',href:'/admin',textContent:'Go to /admin and sign in'})));return}
    check();await load();TIMER=setInterval(()=>{if(!document.hidden)load(true)},60000);
  }catch(e){put(notice('⚠️','Something went wrong',e.message))}
}
async function load(quiet){
  if(!quiet)put(el('div',{className:'grid k4'},...[1,2,3,4].map(()=>el('div',{className:'sk'}))));
  try{DATA=await api('/api/manage',{action:'payments',days:DAYS});paint()}
  catch(e){if(!quiet)put(notice('⚠️','Could not load payments',e.message,el('button',{className:'btn p',textContent:'↻ Try again',onclick:()=>load()})))}
}
function kpi(ic,t,v,h){return el('div',{className:'card kpi'},el('div',{className:'l'},el('span',{className:'ic',textContent:ic}),t),el('div',{className:'v',textContent:String(v)}),el('div',{className:'h',textContent:h||''}))}
function mini(t,v){return el('div',{className:'card mini'},el('div',{className:'v',textContent:v}),el('div',{className:'l',textContent:t}))}
function chart(d){
  const monthly=DAYS>90,map={};
  Object.keys(d.daily||{}).forEach(k=>{const key=monthly?k.slice(0,7):k;map[key]=(map[key]||0)+d.daily[k]});
  const slots=[],now=new Date(),N=monthly?12:Math.min(DAYS,90);
  for(let i=N-1;i>=0;i--){let key,label;
    if(monthly){const x=new Date(now.getFullYear(),now.getMonth()-i,1);key=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');label=x.toLocaleDateString('en-US',{month:'short'})}
    else{const x=new Date(now.getTime()-i*864e5);key=x.toLocaleDateString('en-CA',{timeZone:ET});label=x.toLocaleDateString('en-US',{timeZone:ET,month:'short',day:'numeric'})}
    slots.push({key,label,v:map[key]||0})}
  const mx=Math.max(1,...slots.map(s=>s.v));
  const bars=el('div',{className:'bars'});
  slots.forEach(s=>bars.append(el('i',{style:'height:'+Math.max(s.v?4:1,s.v/mx*100)+'%;'+(s.v?'':'opacity:.25'),title:s.label+': '+usd(s.v)})));
  return el('div',{className:'card'},el('h2',{},'Money received',el('small',{textContent:monthly?'per month':'per day'})),bars,el('div',{className:'axis'},el('span',{textContent:slots[0].label}),el('span',{textContent:'Best: '+usd(mx>1?mx:0)}),el('span',{textContent:slots[slots.length-1].label})));
}
function pair(k,v){return el('div',{},el('small',{textContent:k}),el('span',{textContent:v||'—'}))}
function item(p){
  const full=!p.deposit,bal=p.balanceNum>0.005;
  const sum=el('summary',{},
    el('div',{},el('div',{className:'pn',textContent:p.name||p.email||'Customer'}),el('div',{className:'ps',textContent:p.service})),
    el('div',{className:'pd'},el('div',{className:'pn',textContent:p.dateLabel||p.date}),el('div',{className:'ps',textContent:(p.time?p.time+' · ':'')+'paid '+short(p.created)})),
    el('div',{className:'pa'},usd(p.paid),el('small',{},el('span',{className:'badge '+(p.refunded>=p.paid?'bad':full?'ok':'dep'),textContent:p.refunded>=p.paid?'Refunded':full?'Paid in full':'Deposit'}))));
  const g=el('div',{className:'dg'},
    pair('Event date',(p.dateLabel||p.date)+(p.time?' at '+p.time:'')),pair('Service',p.service),pair('Customer email',p.email),pair('Phone',p.phone),pair('Event address',p.address),
    pair('Subtotal',p.subtotal?usd(p.subtotal):'—'),pair('Sales tax',p.tax?usd(p.tax):'—'),pair('Total price',p.totalNum?usd(p.totalNum):p.total),pair('Paid now',usd(p.paid)),
    pair('Balance still due',p.balance&&p.balanceNum===0&&!/quote/i.test(p.balance)?'$0.00 (paid)':(p.balanceNum?usd(p.balanceNum):p.balance)),
    pair('Discount code',p.coupon?p.coupon+(p.discount?' · '+p.discount:''):''),pair('Black Friday',p.sale),pair('Delivery and pickup',p.delivery?'Yes':'No'),
    pair('Paid on',when(p.created)),pair('Refunded',p.refunded?usd(p.refunded):''),pair('Booking ID',p.id.slice(-12)));
  if(p.receipt){const a=el('a',{href:p.receipt,target:'_blank',rel:'noopener',textContent:'Open Stripe receipt',style:'color:var(--ac)'});g.append(el('div',{},el('small',{textContent:'Receipt'}),a))}
  return el('details',{className:'pay'},sum,g);
}
function csv(){
  const rows=[['Paid on','Customer','Email','Phone','Event date','Time','Service','Subtotal','Tax','Total','Paid now','Balance due','Refunded','Code','Address']];
  DATA.payments.forEach(p=>rows.push([new Date(p.created*1000).toISOString(),p.name,p.email,p.phone,p.dateLabel,p.time,p.service,p.subtotal,p.tax,p.totalNum||p.total,p.paid,p.balanceNum,p.refunded,p.coupon,p.address]));
  const t=rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=el('a',{href:URL.createObjectURL(new Blob([t],{type:'text/csv'})),download:'fortune-studio-payments.csv'});document.body.append(a);a.click();a.remove();
}
function paint(){
  const d=DATA,s=d.summary,out=[];
  if(d.live===false)out.push(el('div',{className:'banner',textContent:'TEST MODE: these are test payments. No real money moved. Real payments appear when the live Stripe keys are in Vercel.'}));
  if(!d.payments.length&&!d.unpaid.length){put(...out,notice('💳','No payments yet','Nothing in the last '+d.days+' days. When a customer pays on the site it shows up here within seconds.'));return}
  out.push(el('div',{className:'grid k4'},kpi('💵','Money received',usd(s.net),s.refunded?'after '+usd(s.refunded)+' refunded':'from '+s.count+' paid booking'+(s.count===1?'':'s')),kpi('🧾','Paid bookings',s.count,s.deposits+' deposit'+(s.deposits===1?'':'s')+', '+(s.count-s.deposits)+' paid in full'),kpi('⏳','Still to collect',usd(s.balanceDue),'balance owed before the events'),kpi('🛒','Not finished',s.unpaid,'opened checkout, did not pay')));
  out.push(el('div',{className:'grid k4s'},mini('Sales tax in these payments',usd(s.tax)),mini('Average booking',usd(s.count?s.gross/s.count:0)),mini('Collected before refunds',usd(s.gross))));
  out.push(el('div',{style:'height:14px'}),chart(d),el('div',{style:'height:14px'}));
  const list=el('div',{className:'pays',id:'plist'});
  const draw=()=>{list.textContent='';const q=Q.toLowerCase();const arr=d.payments.filter(p=>!q||[p.name,p.email,p.phone,p.service,p.dateLabel,p.address,p.coupon].join(' ').toLowerCase().includes(q));
    if(!arr.length)list.append(el('p',{className:'sub',textContent:'No payment matches your search.'}));arr.forEach(p=>list.append(item(p)))};
  const srch=el('input',{className:'srch',type:'search',placeholder:'Search name, phone, date, service…',value:Q,oninput:e=>{Q=e.target.value;draw()}});
  out.push(el('div',{className:'card'},el('h2',{},'Who paid',el('small',{textContent:'tap a booking for every detail'})),el('div',{className:'tools'},srch,el('button',{className:'btn',textContent:'⬇ Download as spreadsheet',onclick:csv})),list));
  draw();
  if(d.unpaid.length){const u=el('div',{className:'pays'});d.unpaid.forEach(p=>u.append(el('details',{className:'pay'},
    el('summary',{},el('div',{},el('div',{className:'pn',textContent:p.name||p.email||'Customer'}),el('div',{className:'ps',textContent:p.service})),el('div',{className:'pd'},el('div',{className:'pn',textContent:p.dateLabel||p.date}),el('div',{className:'ps',textContent:'started '+ago(p.created)})),el('div',{className:'pa'},usd(p.amount),el('small',{},el('span',{className:'badge warn',textContent:p.state==='open'?'Still open':'Expired'})))),
    el('div',{className:'dg'},pair('Phone',p.phone),pair('Email',p.email),pair('Event address',p.address),pair('Started',when(p.created))))));
    out.push(el('div',{style:'height:14px'}),el('div',{className:'card'},el('h2',{},'Started but not paid',el('small',{textContent:'good people to call or text'})),u))}
  put(...out);
}
/* ---- System check: tells you exactly what to fix if payments, emails or the chat stop working ---- */
async function check(){
  const box=$('sys');box.textContent='';
  box.append(el('div',{className:'card mini',style:'margin-bottom:14px',textContent:'Checking Stripe, emails, chat and database…'}));
  try{
    const h=await api('/api/health',{}),bad=h.checks.filter(c=>c.status==='fail'),warn=h.checks.filter(c=>c.status==='warn');
    box.textContent='';
    const all=el('div',{className:'chk'});
    [...bad,...warn,...h.checks.filter(c=>c.status==='ok')].forEach(c=>{const it=el('div',{className:'it'},el('i',{className:'dot '+c.status}),el('div',{},el('b',{textContent:c.label}),el('p',{textContent:c.detail})));if(c.fix&&c.status!=='ok')it.lastChild.append(el('div',{className:'fx',textContent:'How to fix: '+c.fix}));all.append(it)});
    const title=bad.length?'⚠️ '+bad.length+' thing'+(bad.length===1?'':'s')+' to fix':warn.length?'👍 Working, '+warn.length+' tip'+(warn.length===1?'':'s'):'✅ Everything is connected and working';
    const card=el('div',{className:'card',style:'margin-bottom:14px'},el('h2',{},title,el('small',{textContent:(h.mode?h.mode.toUpperCase()+' mode · ':'')+h.host})));
    if(bad.length||warn.length)card.append(all);else{const d=el('details',{},el('summary',{textContent:'Show details',style:'cursor:pointer;color:var(--mu)'}),all);card.append(d)}
    card.append(el('button',{className:'btn',style:'margin-top:12px',textContent:'↻ Run the check again',onclick:check}));
    box.append(card);
  }catch(e){box.textContent='';box.append(el('div',{className:'card mini',style:'margin-bottom:14px;color:var(--bad)',textContent:'System check unavailable: '+e.message}))}
}
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;DAYS=+b.dataset.d;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));load()};
$('ref').onclick=()=>{load();toast('Updated')};
boot();
</script></body></html>
